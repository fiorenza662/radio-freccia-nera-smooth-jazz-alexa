name: Build Radio Freccia Nera Android APK

on:
  push:
    paths:
      - 'android-app/**'
      - '.github/workflows/build-rfn-android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build unsigned release APK
        working-directory: android-app
        run: gradle :app:assembleRelease --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: radio-freccia-nera-android-unsigned
          path: android-app/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
